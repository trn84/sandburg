[supervisord]
nodaemon=true
user=root
logfile=/var/log/sandburg/supervisord.log
logfile_maxbytes=10MB
logfile_backups=2
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Shared defaults are repeated for each program because supervisord has no
; inheritance. Logs: /var/log/sandburg/<name>.log
; Tailscale and mcp-proxy also log to the container log (stdout).

[program:tailscale]
command=/opt/sandburg/bin/start-tailscale.sh
priority=5
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvfb]
command=/opt/sandburg/bin/start-xvfb.sh
priority=10
autorestart=true
stdout_logfile=/var/log/sandburg/xvfb.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true

[program:openbox]
command=/opt/sandburg/bin/start-wm.sh
priority=15
autorestart=true
stdout_logfile=/var/log/sandburg/openbox.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true

[program:x11vnc]
command=/opt/sandburg/bin/start-vnc.sh
priority=20
autorestart=true
stdout_logfile=/var/log/sandburg/x11vnc.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true

[program:novnc]
command=/opt/sandburg/bin/start-novnc.sh
priority=25
autorestart=true
stdout_logfile=/var/log/sandburg/novnc.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true

[program:files]
command=/opt/sandburg/bin/start-files.sh
priority=25
autorestart=true
stdout_logfile=/var/log/sandburg/files.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:blender]
command=/opt/sandburg/bin/start-blender.sh
priority=30
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/sandburg/blender.log
stdout_logfile_maxbytes=20MB
redirect_stderr=true

[program:freecad]
command=/opt/sandburg/bin/start-freecad.sh
priority=30
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/sandburg/freecad.log
stdout_logfile_maxbytes=20MB
redirect_stderr=true

[program:comfyui]
command=/opt/sandburg/bin/start-comfyui.sh
priority=30
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/sandburg/comfyui.log
stdout_logfile_maxbytes=20MB
redirect_stderr=true

[program:voice-setup]
command=/opt/sandburg/bin/setup-voice.sh
priority=40
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=2
stdout_logfile=/var/log/sandburg/voice-setup.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:comfyui-3d-setup]
command=/opt/sandburg/bin/setup-comfyui-3d.sh
priority=40
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=3
stdout_logfile=/var/log/sandburg/comfyui-3d-setup.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:mcp-proxy]
command=/opt/sandburg/bin/start-mcp-proxy.sh
priority=50
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
