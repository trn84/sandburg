[project]
name = "sandburg-disabled-mcp"
version = "0.1.0"
description = "Placeholder MCP server for disabled Sandburg services"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=2,<3"]

[project.scripts]
sandburg-disabled-mcp = "sandburg_disabled.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandburg_disabled"]
