[project]
name = "sandburg-inkscape-mcp"
version = "0.1.0"
description = "MCP server for Inkscape (command line) and potrace: convert, inspect and vectorize SVG"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2,<3",
    "pillow>=10",
    "defusedxml>=0.7",
]

[project.scripts]
sandburg-inkscape-mcp = "sandburg_inkscape.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandburg_inkscape"]
