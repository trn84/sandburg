[project]
name = "sandburg-openmodelica-mcp"
version = "0.1.0"
description = "MCP server for OpenModelica (omc, headless): check, simulate and plot Modelica models"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2,<3",
    "matplotlib>=3.8",
]

[project.scripts]
sandburg-openmodelica-mcp = "sandburg_openmodelica.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sandburg_openmodelica"]
